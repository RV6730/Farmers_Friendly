[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmers-friendly-backend"
version = "0.1.0"
description = "Backend API for Farmers Friendly app"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "scikit-learn==1.3.2",
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pydantic==2.5.2",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=0.19.0",
]
